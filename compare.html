<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主页对比 · 原版与新版</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#eae9f1;color:#272c44}header{height:74px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid #e1deec}header b{font-size:15px;display:block}header small{font-size:10px;color:#a19aac;display:block;margin-top:4px}.controls{display:flex;gap:5px;padding:4px;background:#f2eff8;border-radius:8px}button{border:0;border-radius:5px;padding:8px 14px;background:transparent;color:#8d829d;font:12px system-ui;cursor:pointer}button.active{background:#fff;box-shadow:0 2px 5px #34284c15;color:#6754c7}button:focus-visible,a:focus-visible{outline:3px solid #dca275;outline-offset:3px}.links{display:flex;gap:18px;font-size:11px}a{color:#82729e;text-decoration:none}.panes{height:calc(100% - 74px);display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}article{display:flex;flex-direction:column;min-width:0;border:1px solid #ddd8e8;border-radius:10px;overflow:hidden;background:white}.label{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #e8e3ef;font-size:11px;color:#8e849f}.label b{color:#4e455e;font-weight:500}.label i{width:6px;height:6px;background:#b4a7c6;border-radius:50%;display:inline-block;margin-right:6px}.label .new{color:#7661c4}.label .new i{background:#8870d5}.frame-window{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:top left}.panes.only-new,.panes.only-old{grid-template-columns:1fr}.only-new .old-pane,.only-old .new-pane{display:none}@media(max-width:700px){header{padding:12px 14px;height:auto;min-height:96px;flex-wrap:wrap;gap:10px}header small{max-width:190px;line-height:1.5}.links{gap:12px;font-size:10px}.controls{margin-left:auto}button{padding:7px 9px;font-size:11px}.panes{height:calc(100% - 106px);gap:6px;padding:6px}.label{padding:0 8px;font-size:10px}.label span{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><div><b>主页设计对比</b><small>原版保留 · 新版采用蓝紫与暖橙 · 功能均可操作</small></div><nav class="controls" aria-label="对比显示模式"><button class="active" data-mode="split" aria-pressed="true">并排对比</button><button data-mode="new" aria-pressed="false">只看新版</button><button data-mode="old" aria-pressed="false">只看原版</button></nav><div class="links"><a href="modern.html" target="_blank" rel="noopener">新窗口看新版 ↗</a><a href="original.html" target="_blank" rel="noopener">原版 ↗</a></div></header><main class="panes" id="panes"><article class="old-pane"><div class="label"><b><i></i>A / 原版主页</b><span>同宽桌面视图 · 可操作</span></div><div class="frame-window"><iframe src="original.html" title="原版门户，可直接操作"></iframe></div></article><article class="new-pane"><div class="label"><b class="new"><i></i>B / 新版主页</b><span>同宽桌面视图 · 可操作</span></div><div class="frame-window"><iframe src="modern.html" title="新版门户，可直接操作"></iframe></div></article></main><script>let currentMode='split';function fitFrames(){document.querySelectorAll('.frame-window').forEach(w=>{if(!w.clientWidth)return;let frame=w.querySelector('iframe'),width=currentMode==='split'?1280:w.clientWidth,scale=w.clientWidth/width;frame.style.width=width+'px';frame.style.height=(w.clientHeight/scale)+'px';frame.style.transform='scale('+scale+')';});}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{currentMode=b.dataset.mode;document.getElementById('panes').className='panes'+(currentMode==='split'?'':' only-'+currentMode);document.querySelectorAll('[data-mode]').forEach(e=>{e.classList.toggle('active',e===b);e.setAttribute('aria-pressed',String(e===b));});fitFrames();});new ResizeObserver(fitFrames).observe(document.getElementById('panes'));fitFrames();</script></body></html>
